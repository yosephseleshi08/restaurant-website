{% extends "base.html" %}
{% block title %}Gallery — {{ restaurant.name }}{% endblock %}
{% block content %}
<style>
.gallery-header { text-align: center; padding: 4rem 2rem 2rem; }
.gallery-header h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem; }
.gallery-header p { color: #666; font-size: 1.1rem; }
.tab-bar { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; flex-wrap: wrap; }
.tab-btn {
    padding: 0.75rem 2rem; border: 2px solid var(--primary); background: transparent;
    color: var(--primary); border-radius: 50px; font-weight: 600; cursor: pointer;
    transition: all 0.3s ease; font-size: 0.95rem;
}
.tab-btn:hover, .tab-btn.active { background: var(--primary); color: white; }
.gallery-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem; max-width: 1280px; margin: 0 auto; padding: 0 2rem 4rem;
}
.gallery-item {
    position: relative; border-radius: 16px; overflow: hidden; cursor: pointer;
    aspect-ratio: 4/3; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.gallery-item:hover img { transform: scale(1.05); }
.gallery-caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    color: white; padding: 2rem 1rem 1rem; font-size: 0.95rem; font-weight: 500;
    transform: translateY(100%); transition: transform 0.3s ease;
}
.gallery-item:hover .gallery-caption { transform: translateY(0); }
#lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999;
    display: none; align-items: center; justify-content: center; flex-direction: column;
}
#lightbox.active { display: flex; }
#lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 8px; }
#lightbox p { color: white; margin-top: 1rem; font-size: 1.1rem; }
.close-btn { position: absolute; top: 2rem; right: 2rem; background: none; border: none; color: white; font-size: 3rem; cursor: pointer; }
</style>

<section class="gallery-header">
    <h1>{{ gallery.page_title }}</h1>
    <p>{{ gallery.page_subtitle }}</p>
</section>

<div class="tab-bar">
    <button class="tab-btn active" onclick="filterGallery('all', this)">All</button>
    <button class="tab-btn" onclick="filterGallery('food', this)">Food</button>
    <button class="tab-btn" onclick="filterGallery('interior', this)">Interior</button>
    <button class="tab-btn" onclick="filterGallery('drinks', this)">Drinks</button>
</div>

<div class="gallery-grid" id="galleryGrid">
    {% for photo in gallery.photos %}
    <div class="gallery-item" data-category="{{ photo.category }}" onclick="openLightbox('{{ photo.url }}', '{{ photo.caption }}')">
        <img src="{{ photo.url }}" alt="{{ photo.caption }}" loading="lazy">
        <div class="gallery-caption">{{ photo.caption }}</div>
    </div>
    {% endfor %}
</div>

<div id="lightbox" onclick="this.classList.remove('active')">
    <button class="close-btn" onclick="event.stopPropagation(); document.getElementById('lightbox').classList.remove('active')">&times;</button>
    <img id="lightbox-img" src="" alt="">
    <p id="lightbox-caption"></p>
</div>

<script>
function filterGallery(category, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.gallery-item').forEach(item => {
        item.style.display = (category === 'all' || item.dataset.category === category) ? 'block' : 'none';
    });
}
function openLightbox(url, caption) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox-caption').textContent = caption;
    document.getElementById('lightbox').classList.add('active');
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.getElementById('lightbox').classList.remove('active'); });
</script>
{% endblock %}
