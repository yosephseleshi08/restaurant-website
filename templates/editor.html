{% extends "base.html" %}
{% block title %}Visual Editor — {{ restaurant.name }}{% endblock %}
{% block content %}
<style>
.editor-section { padding: 2rem; max-width: 1200px; margin: 0 auto; }
.editor-header { margin-bottom: 2rem; }
.editor-header h1 { font-size: 2rem; color: var(--primary); }
.editor-card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 2rem; }
.editor-card h3 { color: var(--primary); margin-bottom: 1.5rem; font-size: 1.3rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.75rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
.form-group { margin-bottom: 1.5rem; }
.form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #333; font-size: 0.9rem; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.85rem; border: 1px solid #ddd; border-radius: 10px; font-family: var(--font-body); font-size: 0.95rem; }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--secondary); }
.color-picker { display: flex; gap: 1rem; flex-wrap: wrap; }
.color-item { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.color-item input[type="color"] { width: 60px; height: 60px; border: none; border-radius: 10px; cursor: pointer; }
@media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
</style>

<section class="editor-section">
    <div class="editor-header">
        <h1><i class="fas fa-paint-brush" style="color: var(--secondary); margin-right: 0.5rem;"></i> Visual Editor</h1>
        <p style="color: #666;">Customize your restaurant's theme, colors, and basic information.</p>
    </div>

    <div class="editor-card">
        <h3>Brand Colors</h3>
        <form id="themeForm">
            <div class="color-picker">
                <div class="color-item">
                    <input type="color" name="primary_color" value="{{ theme.primary_color }}">
                    <label>Primary</label>
                </div>
                <div class="color-item">
                    <input type="color" name="secondary_color" value="{{ theme.secondary_color }}">
                    <label>Secondary</label>
                </div>
                <div class="color-item">
                    <input type="color" name="background_color" value="{{ theme.background_color }}">
                    <label>Background</label>
                </div>
                <div class="color-item">
                    <input type="color" name="text_color" value="{{ theme.text_color }}">
                    <label>Text</label>
                </div>
            </div>
            <button type="button" class="btn btn-gold" style="margin-top: 1.5rem;" onclick="saveTheme()">Save Colors</button>
        </form>
    </div>

    <div class="editor-card">
        <h3>Restaurant Information</h3>
        <form id="infoForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Restaurant Name</label>
                    <input type="text" name="name" value="{{ restaurant.name }}">
                </div>
                <div class="form-group">
                    <label>Tagline</label>
                    <input type="text" name="tagline" value="{{ restaurant.tagline }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" value="{{ restaurant.phone }}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ restaurant.email }}">
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" value="{{ restaurant.address }}">
            </div>
            <button type="button" class="btn btn-gold" onclick="saveInfo()">Save Information</button>
        </form>
    </div>
</section>

<script>
function saveTheme() {
    const formData = new FormData(document.getElementById('themeForm'));
    const data = Object.fromEntries(formData.entries());
    fetch('/api/update_theme', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    }).then(res => res.json()).then(data => {
        if(data.success) { alert('Theme saved! Refreshing...'); location.reload(); }
    });
}

function saveInfo() {
    const formData = new FormData(document.getElementById('infoForm'));
    const data = Object.fromEntries(formData.entries());
    fetch('/api/update_restaurant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    }).then(res => res.json()).then(data => {
        if(data.success) { alert('Information saved! Refreshing...'); location.reload(); }
    });
}
</script>
{% endblock %}
