{% extends "base.html" %}
{% block title %}Admin Login — {{ restaurant.name }}{% endblock %}
{% block content %}
<style>
    .login-section { padding: 6rem 2rem; max-width: 400px; margin: 0 auto; text-align: center; }
    .login-card { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #333; }
    .form-group input { width: 100%; padding: 0.85rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
    .login-btn { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: opacity 0.3s; }
    .login-btn:hover { opacity: 0.9; }
</style>
<section class="login-section">
    <div class="login-card">
        <h2 style="color: var(--primary); margin-bottom: 1.5rem;">Admin Login</h2>
        <form method="POST">
            <!-- ✅ CRITICAL FIX: CSRF Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>
</section>
{% endblock %}
