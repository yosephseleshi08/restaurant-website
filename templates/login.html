{% extends "base.html" %}
{% block title %}Login — {{ restaurant.name }}{% endblock %}
{% block content %}
<style>
.login-section { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.login-card { background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
.login-card h2 { text-align: center; color: var(--primary); margin-bottom: 0.5rem; }
.login-card p { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
.form-group { margin-bottom: 1.5rem; }
.form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #333; font-size: 0.9rem; }
.form-group input { width: 100%; padding: 0.85rem; border: 1px solid #ddd; border-radius: 10px; font-family: var(--font-body); font-size: 0.95rem; transition: border-color 0.3s; }
.form-group input:focus { outline: none; border-color: var(--secondary); }
.login-btn { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
.login-btn:hover { background: #1a2332; }
.demo-creds { background: #f0f7f0; color: #2d6a2d; padding: 1rem; border-radius: 10px; text-align: center; font-size: 0.9rem; margin-top: 1.5rem; border: 1px solid #bbf7d0; }
</style>

<section class="login-section">
    <div class="login-card">
        <h2>Admin Login</h2>
        <p>Access the dashboard, kitchen display, and editor.</p>
        
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="demo-creds">
            <strong>Demo Credentials:</strong><br>
            Username: <code>admin</code><br>
            Password: <code>admin123</code>
        </div>
    </div>
</section>
{% endblock %}
