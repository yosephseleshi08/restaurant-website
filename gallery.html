{% extends "base.html" %}
{% block title %}Gallery — {{ restaurant.name }}{% endblock %}
{% block content %}

<section style="text-align: center; padding: 2rem 0 1rem;">
    <h1 style="font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 0.75rem;">{{ gallery.page_title }}</h1>
    <p style="color: #777; font-size: 1.1rem; max-width: 600px; margin: 0 auto;">{{ gallery.page_subtitle }}</p>
    <div class="line" style="width: 60px; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); margin: 1.5rem auto 0; border-radius: 3px;"></div>
</section>

<!-- Category Filters -->
<div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2.5rem;">
    <button class="tab-btn active" onclick="filterGallery('all', this)" style="padding: 0.6rem 1.5rem; border-radius: 30px; border: 2px solid var(--primary); background: var(--primary); color: white; font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: all 0.2s;">All</button>
    <button class="tab-btn" onclick="filterGallery('food', this)" style="padding: 0.6rem 1.5rem; border-radius: 30px; border: 2px solid #e0e0e0; background: white; color: var(--text); font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: all 0.2s;">Food</button>
    <button class="tab-btn" onclick="filterGallery('interior', this)" style="padding: 0.6rem 1.5rem; border-radius: 30px; border: 2px solid #e0e0e0; background: white; color: var(--text); font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: all 0.2s;">Interior</button>
    <button class="tab-btn" onclick="filterGallery('drinks', this)" style="padding: 0.6rem 1.5rem; border-radius: 30px; border: 2px solid #e0e0e0; background: white; color: var(--text); font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: all 0.2s;">Drinks</button>
</div>

<div class="grid grid-3" id="galleryGrid" style="gap: 1rem;">
    {% for photo in gallery.photos %}
    <div class="gallery-item" data-category="{{ photo.category }}" style="border-radius: var(--radius); overflow: hidden; position: relative; cursor: pointer;" onclick="openLightbox('{{ photo.url }}', '{{ photo.caption }}')">
        <img src="{{ photo.url }}" alt="{{ photo.caption }}" style="width: 100%; height: 280px; object-fit: cover; display: block; transition: transform 0.5s ease;" onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">
        <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem 1rem 1rem; background: linear-gradient(transparent, rgba(0,0,0,0.7)); color: white; opacity: 0; transition: opacity 0.3s;" class="gallery-caption">
            <p style="font-weight: 600; font-size: 0.95rem;">{{ photo.caption }}</p>
        </div>
    </div>
    {% endfor %}
</div>

<style>
.gallery-item:hover .gallery-caption { opacity: 1 !important; }
#lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
#lightbox.active { display: flex; }
#lightbox img { max-width: 90vw; max-height: 80vh; object-fit: contain; border-radius: 8px; }
#lightbox p { color: white; margin-top: 1rem; font-size: 1.1rem; }
#lightbox .close-btn { position: absolute; top: 2rem; right: 2rem; color: white; font-size: 2rem; cursor: pointer; background: none; border: none; }
</style>

<div id="lightbox" onclick="this.classList.remove('active')">
    <button class="close-btn" onclick="document.getElementById('lightbox').classList.remove('active')">&times;</button>
    <img id="lightbox-img" src="" alt="">
    <p id="lightbox-caption"></p>
</div>

<script>
function filterGallery(category, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => {
        b.style.background = 'white'; b.style.color = 'var(--text)'; b.style.borderColor = '#e0e0e0';
    });
    btn.style.background = 'var(--primary)'; btn.style.color = 'white'; btn.style.borderColor = 'var(--primary)';
    document.querySelectorAll('.gallery-item').forEach(item => {
        item.style.display = (category === 'all' || item.dataset.category === category) ? 'block' : 'none';
    });
}
function openLightbox(url, caption) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox-caption').textContent = caption;
    document.getElementById('lightbox').classList.add('active');
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.getElementById('lightbox').classList.remove('active'); });
</script>

{% endblock %}
